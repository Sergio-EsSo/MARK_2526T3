<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi primera plantilla bootstrap</title>
    </head>
    <body>
        <h2>mi primer ejemplo</h2>

        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-3 bg-primary text-white p-3">Libro 1</div>
                <div class="col-12 col-md-6 col-lg-3 bg-secondary text-white p-3">Libro 2</div>
                <div class="col-12 col-md-6 col-lg-3 bg-success text-white p-3">Libro 3</div>
                <div class="col-12 col-md-6 col-lg-3 bg-warning text-white p-3">Libro 4</div>
            </div>
        </div>

    <!--tengo que añadir el css minimo de un bootstrap, generalmente al principio-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--es aconsejable usar la libreria popper js para buen funcionamiento-->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

        <!--tengo que añadir el javascript minimo de un bootstrap, generalmente al final-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
